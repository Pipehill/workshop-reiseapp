openapi: 3.0.4
info:
  title: Reiseapp API
  version: 0.1.0
  description: API-kontrakt for reiseappen.
tags:
  - name: Participation
    description: Påmelding og avmelding av personer til aktiviteter.
  - name: Accommodation
    description: Tildeling og fjerning av rom for personer.
  - name: Activity
    description: Uthenting av aktiviteter og praktiske råd.
  - name: Health
    description: Livssjekk for applikasjonen.
  - name: Person
    description: Oppretting og uthenting av personer.
  - name: Room
    description: Uthenting av rom og romdetaljer.
paths:
  /persons/{personId}/activity:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Participation]
      operationId: enrollInActivity
      summary: Melder personen på en aktivitet.
      description: >
        Bytter aktivitet hvis personen allerede er påmeldt en annen aktivitet.
        Ved feil beholdes eksisterende påmelding. Gjentatt påmelding til samme
        aktivitet lykkes uten endringer, også når aktiviteten er full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollInActivityRequest'
      responses:
        '204':
          description: Personen er påmeldt aktiviteten.
        '400':
          description: Ugyldig person-ID eller aktivitets-ID.
        '404':
          description: Personen eller aktiviteten finnes ikke.
        '409':
          description: Aktiviteten er full. Eksisterende påmelding er uendret.
    delete:
      tags: [Participation]
      operationId: cancelActivityEnrollment
      summary: Melder personen av aktiviteten.
      description: Lykkes også når personen ikke er påmeldt noen aktivitet.
      responses:
        '204':
          description: Personen er ikke påmeldt noen aktivitet.
        '400':
          description: Ugyldig person-ID.
        '404':
          description: Personen finnes ikke.
  /persons/{personId}/room:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Accommodation]
      operationId: assignRoom
      summary: Tildeler et rom til en person.
      description: >
        Flytter personen hvis vedkommende har et annet rom. Rommet må ha en
        ledig seng. Ved feil beholdes eksisterende tildeling. Gjentatt tildeling
        til samme rom lykkes uten endringer, også når rommet er fullt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoomRequest'
      responses:
        '204':
          description: Personen er tildelt rommet.
        '400':
          description: Ugyldig person-ID eller romnummer.
        '404':
          description: Personen eller rommet finnes ikke.
        '409':
          description: Rommet er fullt. Eksisterende tildeling er uendret.
    delete:
      tags: [Accommodation]
      operationId: removeRoomAssignment
      summary: Fjerner personens romtildeling.
      description: Lykkes også når personen allerede er uten rom.
      responses:
        '204':
          description: Personen har ingen romtildeling.
        '400':
          description: Ugyldig person-ID.
        '404':
          description: Personen finnes ikke.
  /activities:
    get:
      tags: [Activity]
      operationId: listActivities
      summary: Henter alle aktiviteter.
      responses:
        '200':
          description: Alle aktiviteter sortert på starttidspunkt og deretter ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'
  /activities/{activityId}:
    get:
      tags: [Activity]
      operationId: getActivity
      summary: Henter detaljer om en aktivitet.
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Aktiviteten med angitt ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetailsResponse'
        '400':
          description: Ugyldig aktivitets-ID.
        '404':
          description: Aktiviteten finnes ikke.
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Kontrollerer at API-et kan svare.
      description: Livssjekk for applikasjonen. Kontrollerer ikke databasetilkoblingen.
      responses:
        '200':
          description: API-et svarer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /persons:
    get:
      tags: [Person]
      operationId: listPersons
      summary: Henter alle registrerte personer.
      responses:
        '200':
          description: Alle registrerte personer, sortert på ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonResponse'
    post:
      tags: [Person]
      operationId: createPerson
      summary: Registrerer en ny person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Personen ble registrert.
          headers:
            Location:
              description: Relativ URI til den registrerte personen.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          description: Forespørselen er ugyldig.
  /persons/{personId}:
    get:
      tags: [Person]
      operationId: getPerson
      summary: Henter én registrert person.
      parameters:
        - name: personId
          in: path
          required: true
          description: Personens ID.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Personen som har angitt ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetailsResponse'
        '404':
          description: Personen finnes ikke.
  /rooms:
    get:
      tags: [Room]
      operationId: listRooms
      summary: Henter alle rom.
      responses:
        '200':
          description: Alle rom, sortert på romnummer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomResponse'
  /rooms/{roomNumber}:
    get:
      tags: [Room]
      operationId: getRoom
      summary: Henter detaljer om ett rom.
      parameters:
        - name: roomNumber
          in: path
          required: true
          description: Romnummeret.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Rommet med angitt romnummer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetailsResponse'
        '400':
          description: Romnummeret er ugyldig.
        '404':
          description: Rommet finnes ikke.
components:
  schemas:
    EnrollInActivityRequest:
      type: object
      required: [activityId]
      properties:
        activityId:
          type: integer
          format: int64
          minimum: 1
          example: 1
    AssignRoomRequest:
      type: object
      required: [roomNumber]
      properties:
        roomNumber:
          type: integer
          format: int32
          minimum: 1
          example: 106
    ActivityDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/ActivityResponse'
        - type: object
          required: [participants]
          properties:
            participants:
              type: array
              description: Deltakere sortert på person-ID. Tom liste når ingen deltar.
              items:
                $ref: '#/components/schemas/PersonResponse'
    ActivityResponse:
      type: object
      description: En aktivitet varer fra og med 2 til og med 8 timer.
      required: [id, title, description, maxParticipants, startTime, endTime, notes]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Fjelltur til utsiktspunktet
        description:
          type: string
          minLength: 1
          example: Guidet fjelltur med matpause og utsikt over fjorden.
        maxParticipants:
          type: integer
          format: int32
          minimum: 1
          example: 16
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: Startklokkeslett i format HH:mm:ss.
          example: '09:00:00'
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: Sluttklokkeslett i format HH:mm:ss, 2–8 timer etter start samme dag.
          example: '15:00:00'
        notes:
          type: string
          description: Fritekst med praktiske råd og utstyr deltakeren bør huske. Tom streng hvis det ikke finnes råd.
          example: Ta med varme klær og gode tursko. Pakk mat og vann i en sekk.
    PersonDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/PersonResponse'
        - type: object
          properties:
            activity:
              description: Personens aktivitet. Null eller utelatt når personen ikke har en aktivitet.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ActivityResponse'
            assignedRoom:
              description: Tildelt rom. Null eller utelatt hvis personen ikke har rom.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RoomResponse'
    RoomDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/RoomResponse'
        - type: object
          required: [persons]
          properties:
            persons:
              description: Tildelte personer sortert på ID. Tom liste for ledige rom.
              type: array
              items:
                $ref: '#/components/schemas/PersonResponse'
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
          example: UP
    CreatePersonRequest:
      type: object
      required: [name, department, email, phoneNumber, gender]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Vennlige Foss
        department:
          type: string
          minLength: 1
          maxLength: 100
          example: Produkt
        email:
          type: string
          format: email
          maxLength: 254
          example: vennlige.foss@reiseapp.test
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: +47 0000 0011
        gender:
          type: string
          minLength: 1
          maxLength: 50
          example: kvinne
    PersonResponse:
      type: object
      required: [id, name, department, email, phoneNumber, gender, registrationDate]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 11
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Vennlige Foss
        department:
          type: string
          minLength: 1
          maxLength: 100
          example: Produkt
        email:
          type: string
          format: email
          maxLength: 254
          example: vennlige.foss@reiseapp.test
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: +47 0000 0011
        gender:
          type: string
          minLength: 1
          maxLength: 50
          example: kvinne
        registrationDate:
          type: string
          format: date
          example: '2026-09-15'
    RoomResponse:
      type: object
      required: [roomNumber, sizeSquareMeters, numberOfBeds, hasBalcony, lastRenovatedYear]
      properties:
        roomNumber:
          type: integer
          format: int32
          minimum: 1
          example: 204
        sizeSquareMeters:
          type: integer
          format: int32
          minimum: 1
          example: 28
        numberOfBeds:
          type: integer
          format: int32
          enum: [1, 2, 4]
          example: 2
        hasBalcony:
          type: boolean
          example: true
        lastRenovatedYear:
          type: integer
          format: int32
          minimum: 1900
          maximum: 2100
          example: 2024
