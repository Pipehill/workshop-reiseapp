openapi: 3.0.4
info:
  title: Travel App API
  version: 0.1.0
  description: API contract for the travel app.
tags:
  - name: Participation
    description: Activity enrollment and cancellation for persons.
  - name: Accommodation
    description: Room assignment and removal for persons.
  - name: Activity
    description: Retrieval of activities and practical advice.
  - name: Health
    description: Application liveness check.
  - name: Person
    description: Creation and retrieval of persons.
  - name: Room
    description: Retrieval of rooms and room details.
paths:
  /persons/{personId}/activity:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Participation]
      operationId: enrollInActivity
      summary: Enrolls a person in an activity.
      description: >
        Switches activities if the person is already enrolled in another activity.
        If the request fails, the existing enrollment is preserved. Repeated enrollment
        in the same activity succeeds without changes, even when the activity is full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollInActivityRequest'
      responses:
        '204':
          description: The person is enrolled in the activity.
        '400':
          description: Invalid person ID or activity ID.
        '404':
          description: The person or activity does not exist.
        '409':
          description: The activity is full. The existing enrollment is unchanged.
    delete:
      tags: [Participation]
      operationId: cancelActivityEnrollment
      summary: Cancels the person's activity enrollment.
      description: Also succeeds when the person is not enrolled in any activity.
      responses:
        '204':
          description: The person is not enrolled in any activity.
        '400':
          description: Invalid person ID.
        '404':
          description: The person does not exist.
  /persons/{personId}/room:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Accommodation]
      operationId: assignRoom
      summary: Assigns a room to a person.
      description: >
        Moves the person if they already have another room. The room must have an
        available bed. If the request fails, the existing assignment is preserved. Repeated assignment
        to the same room succeeds without changes, even when the room is full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoomRequest'
      responses:
        '204':
          description: The person is assigned to the room.
        '400':
          description: Invalid person ID or room number.
        '404':
          description: The person or room does not exist.
        '409':
          description: The room is full. The existing assignment is unchanged.
    delete:
      tags: [Accommodation]
      operationId: removeRoomAssignment
      summary: Removes the person's room assignment.
      description: Also succeeds when the person has no room assignment.
      responses:
        '204':
          description: The person has no room assignment.
        '400':
          description: Invalid person ID.
        '404':
          description: The person does not exist.
  /activities:
    get:
      tags: [Activity]
      operationId: listActivities
      summary: Retrieves all activities.
      responses:
        '200':
          description: All activities, sorted by start time and then ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'
  /activities/{activityId}:
    get:
      tags: [Activity]
      operationId: getActivity
      summary: Retrieves activity details.
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The activity with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetailsResponse'
        '400':
          description: Invalid activity ID.
        '404':
          description: The activity does not exist.
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Checks whether the API can respond.
      description: Application liveness check. Does not check the database connection.
      responses:
        '200':
          description: The API is responding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /persons:
    get:
      tags: [Person]
      operationId: listPersons
      summary: Retrieves all registered persons.
      responses:
        '200':
          description: All registered persons, sorted by ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonResponse'
    post:
      tags: [Person]
      operationId: createPerson
      summary: Registers a new person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: The person was registered.
          headers:
            Location:
              description: Relative URI of the registered person.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          description: The request is invalid.
  /persons/{personId}:
    get:
      tags: [Person]
      operationId: getPerson
      summary: Retrieves a registered person.
      parameters:
        - name: personId
          in: path
          required: true
          description: The person's ID.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The person with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetailsResponse'
        '404':
          description: The person does not exist.
  /rooms:
    get:
      tags: [Room]
      operationId: listRooms
      summary: Retrieves all rooms.
      responses:
        '200':
          description: All rooms, sorted by room number.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomResponse'
  /rooms/{roomNumber}:
    get:
      tags: [Room]
      operationId: getRoom
      summary: Retrieves room details.
      parameters:
        - name: roomNumber
          in: path
          required: true
          description: The room number.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The room with the specified room number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetailsResponse'
        '400':
          description: The room number is invalid.
        '404':
          description: The room does not exist.
components:
  schemas:
    EnrollInActivityRequest:
      type: object
      required: [activityId]
      properties:
        activityId:
          type: integer
          format: int64
          minimum: 1
          example: 1
    AssignRoomRequest:
      type: object
      required: [roomNumber]
      properties:
        roomNumber:
          type: integer
          format: int32
          minimum: 1
          example: 106
    ActivityDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/ActivityResponse'
        - type: object
          required: [participants]
          properties:
            participants:
              type: array
              description: Participants sorted by person ID. An empty list when there are no participants.
              items:
                $ref: '#/components/schemas/PersonResponse'
    ActivityResponse:
      type: object
      description: An activity lasts between 2 and 8 hours, inclusive.
      required: [id, title, description, maxParticipants, startTime, endTime, notes]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Mountain hike to the viewpoint
        description:
          type: string
          minLength: 1
          example: Guided mountain hike with a meal break and views of the fjord.
        maxParticipants:
          type: integer
          format: int32
          minimum: 1
          example: 16
        startTime:
          type: string
          pattern: '^([1-9]|[12][0-9]|3[01])\.(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec) ([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Start date and time as day.lowercase English month abbreviation HH:mm, without a year or time zone.
          example: '13.oct 09:00'
        endTime:
          type: string
          pattern: '^([1-9]|[12][0-9]|3[01])\.(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec) ([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: End date and time in the same format as startTime, 2–8 hours after the start on the same day.
          example: '13.oct 15:00'
        notes:
          type: string
          description: Free text with practical advice and equipment to bring. An empty string when there is no advice.
          example: Bring warm clothing and sturdy hiking shoes. Pack food and water in a backpack.
    PersonDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/PersonResponse'
        - type: object
          properties:
            activity:
              description: The person's activity. Null or omitted when the person has no activity.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ActivityResponse'
            assignedRoom:
              description: The assigned room. Null or omitted when the person has no room.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RoomResponse'
    RoomDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/RoomResponse'
        - type: object
          required: [persons]
          properties:
            persons:
              description: Assigned persons sorted by ID. An empty list for unoccupied rooms.
              type: array
              items:
                $ref: '#/components/schemas/PersonResponse'
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
          example: UP
    CreatePersonRequest:
      type: object
      required: [name, department, email, phoneNumber, gender]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Friendly Falls
        department:
          type: string
          minLength: 1
          maxLength: 100
          example: Product
        email:
          type: string
          format: email
          maxLength: 254
          example: friendly.falls@reiseapp.test
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: +47 0000 0011
        gender:
          type: integer
          format: int32
    PersonResponse:
      type: object
      required: [id, name, department, email, phoneNumber, gender, registrationDate]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 11
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Friendly Falls
        department:
          type: string
          minLength: 1
          maxLength: 100
          example: Product
        email:
          type: string
          format: email
          maxLength: 254
          example: friendly.falls@reiseapp.test
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: +47 0000 0011
        gender:
          type: integer
          format: int32
        registrationDate:
          type: string
          format: date-time
          description: Registration timestamp with a UTC offset.
          example: '2026-09-15T10:30:00Z'
    RoomResponse:
      type: object
      required: [roomNumber, sizeSquareMeters, numberOfBeds, hasBalcony, lastRenovatedYear]
      properties:
        roomNumber:
          type: integer
          format: int32
          minimum: 1
          example: 204
        sizeSquareMeters:
          type: integer
          format: int32
          minimum: 1
          example: 28
        numberOfBeds:
          type: integer
          format: int32
          enum: [1, 2, 4]
          example: 2
        hasBalcony:
          type: boolean
          example: true
        lastRenovatedYear:
          type: string
          format: date
          description: January 1 of the last renovation year, without a time or time zone.
          example: '2024-01-01'
