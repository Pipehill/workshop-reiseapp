openapi: 3.0.4
info:
  title: Reiseapp API
  version: 0.1.0
  description: API-kontrakt for workshop-reiseappen.
tags:
  - name: Ping
    description: Enkel kontrakt for å verifisere prosjektoppsettet.
paths:
  /ping:
    get:
      tags: [Ping]
      operationId: ping
      summary: Returnerer en enkel bekreftelse fra API-et.
      responses:
        '200':
          description: API-et svarer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
components:
  schemas:
    PingResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          example: pong
