services:
  database:
    image: docker.io/library/postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${REISEAPP_DATABASE_NAME:-reiseapp}
      POSTGRES_USER: ${REISEAPP_DATABASE_USER:-reiseapp}
      POSTGRES_PASSWORD: ${REISEAPP_DATABASE_PASSWORD:-reiseapp-local}
    ports:
      - "127.0.0.1:${REISEAPP_DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  service:
    build:
      context: ./service
      dockerfile: Dockerfile
    image: localhost/workshop-reiseapp:dev
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${REISEAPP_DATABASE_NAME:-reiseapp}
      SPRING_DATASOURCE_USERNAME: ${REISEAPP_DATABASE_USER:-reiseapp}
      SPRING_DATASOURCE_PASSWORD: ${REISEAPP_DATABASE_PASSWORD:-reiseapp-local}
    ports:
      - "127.0.0.1:${REISEAPP_API_PORT:-8080}:8080"
    stop_grace_period: 30s

volumes:
  postgres-data:
